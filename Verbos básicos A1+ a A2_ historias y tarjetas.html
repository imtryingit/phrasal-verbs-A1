<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verbos básicos A1+ → A2 · Historias y tarjetas</title>
<style>
:root{--bg:#f6f0e8;--panel:#fffaf3;--line:#e0d3c3;--text:#2a211a;--mute:#6e5f51;--acc:#9a5b0a;--ok:#2f7d52;--bad:#b2432f;--okbg:#e4f2ea;--badbg:#f8e3de;--btn:#fffaf3;--hdr:rgba(246,240,232,.94);--shade:#4a3a2a55;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141110;--panel:#1e1916;--line:#352c26;--text:#f1e8de;--mute:#a99a8b;--acc:#e8a948;--ok:#7fc29b;--bad:#e5806f;--okbg:#1f2d25;--badbg:#33201c;--btn:#1a1209;--hdr:rgba(20,17,16,.94);--shade:#000a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141110;--panel:#1e1916;--line:#352c26;--text:#f1e8de;--mute:#a99a8b;--acc:#e8a948;--ok:#7fc29b;--bad:#e5806f;--okbg:#1f2d25;--badbg:#33201c;--btn:#1a1209;--hdr:rgba(20,17,16,.94);--shade:#000a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:18px/1.7 Georgia,serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hdr);z-index:30}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hdr);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:8px 10px}
.tabs,.pills{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.pills{margin-top:8px}
.tab,.pill{background:none;border:1px solid transparent;border-radius:10px;padding:7px 14px;font:600 15px system-ui,sans-serif;color:var(--mute)}
.pill{border-color:var(--line);font-size:13px;padding:5px 10px}
.tab[aria-selected=true],.pill[aria-pressed=true]{background:var(--panel);border-color:var(--acc);color:var(--acc)}
main{max-width:760px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:clamp(25px,5vw,34px);line-height:1.2;margin-bottom:4px}
.sub,.ctx,.hint{color:var(--mute);font:15px/1.5 system-ui,sans-serif}.sub{margin-bottom:20px}
section{display:none}section.on{display:block}
.story{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:10px;padding:18px 22px;font-size:20px;line-height:1.9}
.pv{color:var(--acc);font-weight:700;border:0;border-bottom:1.5px dashed var(--acc);background:none;padding:0}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--panel);border-top:2px solid var(--acc);padding:16px 18px calc(16px + env(safe-area-inset-bottom,0px));font:16px/1.5 system-ui,sans-serif;display:none;box-shadow:0 -10px 30px var(--shade)}
#sheet.on{display:block;animation:up .25s}#sheet>div{max-width:720px;margin:auto}
#sheet h3{font:700 24px Georgia,serif;color:var(--acc)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.btn{background:var(--acc);color:var(--btn);border:0;border-radius:10px;padding:10px 20px;font:700 16px system-ui,sans-serif}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--text)}
.sp{background:none;border:1px solid var(--line);border-radius:8px;padding:2px 10px;font-size:16px}
.bar{display:flex;justify-content:space-between;font:600 15px system-ui,sans-serif;color:var(--mute);margin-bottom:8px}
.prog,.tbar{height:5px;background:var(--line);border-radius:5px;margin-bottom:18px;overflow:hidden}
.prog i,.tbar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.tbar i{width:100%;transition:width 9s linear}
.fc{perspective:900px;cursor:pointer;margin-bottom:16px;animation:pop .35s;outline-offset:4px}
@keyframes pop{from{transform:scale(.92) translateX(30px);opacity:0}}
.in{display:grid;transform-style:preserve-3d;transition:transform .45s}
.fc.f .in{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;background:var(--panel);border:2px solid var(--acc);border-radius:18px;min-height:270px;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.face.back{transform:rotateY(180deg)}
.fv{font-size:clamp(36px,9vw,56px);font-weight:700;color:var(--acc);line-height:1.1}
.fv2{font-size:clamp(26px,6vw,34px);font-weight:700}
.ex{font:20px/1.5 Georgia,serif}.ex b{color:var(--acc)}.exs{color:var(--mute);font:16px system-ui,sans-serif}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 4px;font:600 14px/1.3 system-ui,sans-serif}
.grades small{display:block;color:var(--mute);font-weight:400}
.grades button:hover{border-color:var(--acc)}
.q{font-size:clamp(21px,4vw,27px);line-height:1.5;margin-bottom:6px}
.gap{display:inline-block;min-width:90px;border-bottom:2px solid var(--acc);text-align:center;color:var(--acc)}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;font:18px system-ui,sans-serif}
.opt.ok{border-color:var(--ok);background:var(--okbg);animation:pop2 .3s}
.opt.bad{border-color:var(--bad);background:var(--badbg);animation:shake .35s}
.fb{margin-top:16px;padding:14px 18px;border-radius:12px;background:var(--panel);border:1px solid var(--acc);font:16px/1.6 system-ui,sans-serif;display:grid;gap:6px;animation:up .25s}.fb .ex{font-size:18px}.fb .btn{justify-self:start;margin-top:6px}
@keyframes pop2{50%{transform:scale(1.04)}}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.end{text-align:center;padding:30px 0;display:grid;gap:12px;justify-items:center}.big{font-size:64px;line-height:1}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.cf{position:fixed;top:-30px;font-size:26px;animation:fall 1.8s ease-in forwards;pointer-events:none;z-index:99}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="tabs" role="tablist">
    <button class="tab" data-t="read" aria-selected="true">📖 Historia</button>
    <button class="tab" data-t="cards" aria-selected="false">🃏 Tarjetas</button>
    <button class="tab" data-t="quiz" aria-selected="false">⚡ Ronda rápida</button>
  </div>
  <div class="pills" id="pills"></div>
</header>
<main>
  <section id="read" class="on"></section>
  <section id="cards"></section>
  <section id="quiz"></section>
</main>
<div id="sheet"><div id="sc"></div></div>
<script>

const D=[{"n": "Mi día", "e": "☀️", "s": "I {work} in a bank, and I {study} English at night. In the morning I {eat} breakfast and {drink} coffee. I {walk} to the bus. After work, I {cook} dinner and {wash} the dishes. On Sunday we {clean} the house and {go} to the park. Every night I {sleep} eight hours.", "w": [["eat", "comer", "I eat breakfast at seven.", "Desayuno a las siete."], ["drink", "beber, tomar", "We drink water after class.", "Tomamos agua después de clase."], ["cook", "cocinar", "I cook dinner for my family.", "Cocino la cena para mi familia."], ["wash", "lavar", "They wash the car on Saturday.", "Lavan el carro los sábados."], ["work", "trabajar", "I work in a bank.", "Trabajo en un banco."], ["study", "estudiar", "We study English at night.", "Estudiamos inglés en la noche."], ["sleep", "dormir", "I sleep eight hours every night.", "Duermo ocho horas cada noche."], ["walk", "caminar", "I walk to school with my friend.", "Camino al colegio con mi amigo."], ["clean", "limpiar", "We clean the house on Sunday.", "Limpiamos la casa los domingos."], ["go", "ir", "We go to the park on Sundays.", "Vamos al parque los domingos."]]}, {"n": "En el mercado", "e": "🛒", "s": "On Saturday I {visit} the market and {meet} my friend there. I {choose} some fruit and {buy} bread. A man {sell|sells} fresh juice. I {pay} with cash and {carry} my bags. At six the owner {close|closes} the shop. At home I cannot {find} my keys, so I {open} the window.", "w": [["buy", "comprar", "I buy bread at the market.", "Compro pan en el mercado."], ["pay", "pagar", "We pay with cash.", "Pagamos en efectivo."], ["sell", "vender", "They sell fruit on this street.", "Venden fruta en esta calle."], ["choose", "elegir", "Choose a color, please.", "Elige un color, por favor."], ["carry", "llevar, cargar", "I carry my bag every day.", "Llevo mi bolso todos los días."], ["open", "abrir", "Open the door, please.", "Abre la puerta, por favor."], ["close", "cerrar", "Please close the window.", "Por favor, cierra la ventana."], ["visit", "visitar", "We visit my grandmother on Sundays.", "Visitamos a mi abuela los domingos."], ["meet", "encontrarse con, conocer", "I meet my friends at the mall.", "Me encuentro con mis amigos en el centro comercial."], ["find", "encontrar", "I can’t find my phone.", "No encuentro mi celular."]]}, {"n": "Mi familia", "e": "❤️", "s": "I {love} my family. My mother {call|calls} me every night. I {answer} the phone and {listen} to her. I {like} her stories. She {need|needs} help with the shopping, so I {help} her. I {want} to visit her soon. Today I {ask} her a question. She says: “{wait|Wait} a minute!”", "w": [["love", "amar, querer mucho", "I love my family.", "Amo a mi familia."], ["like", "gustar", "I like pizza.", "Me gusta la pizza."], ["want", "querer", "I want a new phone.", "Quiero un celular nuevo."], ["need", "necesitar", "We need more time.", "Necesitamos más tiempo."], ["help", "ayudar", "Please help me with my homework.", "Por favor, ayúdame con la tarea."], ["ask", "preguntar", "I ask my teacher a question.", "Le hago una pregunta a mi profesor."], ["answer", "contestar", "Answer the phone, please.", "Contesta el teléfono, por favor."], ["call", "llamar", "I call my mother every night.", "Llamo a mi mamá todas las noches."], ["wait", "esperar", "Wait here, please.", "Espera aquí, por favor."], ["listen", "escuchar", "Listen to the teacher.", "Escucha al profesor."]]}, {"n": "Mis vacaciones (pasado)", "e": "🏖️", "s": "Last summer I {travel|traveled} to the coast with my family. We {arrive|arrived} at noon and {stay|stayed} in a small hotel. In the morning we {play|played} football on the beach. We {watch|watched} the sea and {talk|talked} for hours. We {live|lived} like kings for a week! My vacation {start|started} on Monday and {finish|finished} on Sunday. I {decide|decided} to go again next year.", "w": [["travel", "viajar", "We travel by bus.", "Viajamos en bus."], ["arrive", "llegar", "We arrive at the hotel at noon.", "Llegamos al hotel al mediodía."], ["stay", "quedarse, alojarse", "I stay at home when it rains.", "Me quedo en casa cuando llueve."], ["play", "jugar, tocar", "We play football on Saturdays.", "Jugamos fútbol los sábados."], ["watch", "ver, mirar", "I watch TV after dinner.", "Veo televisión después de la cena."], ["talk", "hablar, conversar", "I talk to my friends online.", "Hablo con mis amigos en línea."], ["live", "vivir", "I live in a small house.", "Vivo en una casa pequeña."], ["start", "empezar", "We start at nine.", "Empezamos a las nueve."], ["finish", "terminar", "I finish work at five.", "Termino el trabajo a las cinco."], ["decide", "decidir", "I decide to study today.", "Decido estudiar hoy."]]}, {"n": "Aprender inglés", "e": "📚", "s": "I {learn} English every day. I {read} short stories and {write} new words in my notebook. I {use} my phone to {send} messages in English. My cousin wants to learn too, so I {teach} him. I {give} him my old book and {bring} him a dictionary. Now he can {make} sentences. I {remember} my first lesson!", "w": [["learn", "aprender", "We learn ten new words every day.", "Aprendemos diez palabras nuevas cada día."], ["read", "leer", "I read a book every month.", "Leo un libro cada mes."], ["write", "escribir", "Write your name here.", "Escribe tu nombre aquí."], ["use", "usar", "I use my phone to study.", "Uso mi celular para estudiar."], ["send", "enviar", "I send messages to my friends.", "Envío mensajes a mis amigos."], ["teach", "enseñar", "I teach English to my cousin.", "Le enseño inglés a mi primo."], ["give", "dar", "Give me your pen, please.", "Dame tu lápiz, por favor."], ["bring", "traer", "Bring your book tomorrow.", "Trae tu libro mañana."], ["make", "hacer, preparar", "I make coffee every morning.", "Preparo café cada mañana."], ["remember", "recordar", "I remember my teacher’s name.", "Recuerdo el nombre de mi profesor."]]}];
const $=s=>document.querySelector(s),all=D.flatMap(d=>d.w);
const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const hl=(t,k)=>t.replace(new RegExp("\\b"+k+"\\b","i"),m=>`<b>${m}</b>`);
const say=t=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.85;speechSynthesis.speak(u)}catch(e){}};
let best={};try{best=JSON.parse(localStorage.getItem("vb1")||"{}")}catch(e){}
let cur=0,tab="read",Q=[],R=[],qi=0,sc=0,cb=0,tm=0,t0=0;
function burst(){for(let i=0;i<26;i++){const s=document.createElement("span");s.className="cf";s.textContent=["🎉","⭐","✨","🔥"][i%4];s.style.cssText=`left:${Math.random()*95}vw;animation-delay:${Math.random()*.4}s`;document.body.append(s);setTimeout(()=>s.remove(),2300)}}
function pills(){$("#pills").innerHTML=D.map((d,i)=>`<button class="pill" aria-pressed="${i==cur}" data-i="${i}" title="${d.n}">${d.e} ${i+1}${best[i]?" ⭐":""}</button>`).join("")}
function story(){const d=D[cur];$("#read").innerHTML=`<h1>${d.e} ${d.n}</h1><p class="sub">Historia ${cur+1} de ${D.length}. Lee la historia y toca cada verbo en color: verás su significado y un ejemplo. Después pasa a las tarjetas.</p><article class="story">${d.s.replace(/\{([^}|]+)(?:\|([^}]+))?\}/g,(m,k,s)=>`<button class="pv" data-k="${k}">${s||k}</button>`)}</article><div class="row" style="margin-top:20px"><button class="btn" data-go="cards">🃏 Practicar estos 10 verbos</button></div>`}
function sheet(k){const w=all.find(x=>x[0]===k);$("#sc").innerHTML=`<h3>${w[0]} <button class="sp" data-say="${w[0]}">🔊</button></h3><p><b>${w[1]}</b></p><p class="ex">${hl(w[2],w[0])}</p><p class="exs">${w[3]}</p>`;$("#sheet").classList.add("on");say(w[0])}
function cards(start){
  if(start)Q=[...D[cur].w];
  const el=$("#cards");
  if(!Q.length){el.innerHTML=`<div class="end"><div class="big">🎉</div><h1>¡Mazo ${cur+1} completo!</h1><p class="sub">Ahora demuestra que los recuerdas, rápido.</p><div class="row"><button class="btn" data-go="quiz">⚡ Ronda rápida</button><button class="btn ghost" data-go="again">Repetir tarjetas</button></div></div>`;burst();return}
  const w=Q[0],d=10-Q.length;
  el.innerHTML=`<div class="bar"><span>Faltan ${Q.length}</span><span>${d}/10</span></div><div class="prog"><i style="width:${d*10}%"></i></div>
  <div class="fc" id="fc" tabindex="0" role="button" aria-label="Voltear tarjeta"><div class="in"><div class="face"><div class="fv">${w[0]}</div><button class="sp" data-say="${w[0]}">🔊</button><p class="hint">Piensa qué significa · toca o pulsa Espacio</p></div><div class="face back"><div class="fv2">${w[1]}</div><p class="ex">${hl(w[2],w[0])}</p><p class="exs">${w[3]}</p></div></div></div>
  <div class="grades" id="gr" style="visibility:hidden"><button data-g="0">Otra vez<small>1</small></button><button data-g="1">Difícil<small>2</small></button><button data-g="2">Bien<small>3</small></button><button data-g="3">Fácil<small>4</small></button></div>`;
  $("#fc").focus({preventScroll:true});say(w[0]);
}
function flip(){const f=$("#fc");if(!f||f.classList.contains("f"))return;f.classList.add("f");$("#gr").style.visibility="visible";say(Q[0][2])}
function grade(g){if(!$("#fc")?.classList.contains("f"))return;const c=Q.shift();if(g<2)Q.splice(Math.min(g?4:2,Q.length),0,c);cards()}
function quiz(start){
  clearTimeout(tm);
  if(start){R=shuf(D[cur].w);qi=0;sc=0;cb=0}
  const el=$("#quiz");
  if(qi>=R.length){const b=best[cur]||0;best[cur]=Math.max(b,sc);try{localStorage.setItem("vb1",JSON.stringify(best))}catch(e){}pills();
    el.innerHTML=`<div class="end"><div class="big">${sc>1200?"🏆":"⭐"}</div><h1>${sc} puntos</h1><p class="sub">${sc>b?"¡Nuevo récord!":"Tu récord: "+b}</p><div class="row"><button class="btn" data-go="quizagain">Otra ronda</button>${cur<D.length-1?`<button class="btn ghost" data-go="next">Siguiente mazo →</button>`:""}</div></div>`;if(sc>b)burst();return}
  const w=R[qi],o=shuf([w,...shuf(D[cur].w.filter(x=>x[0]!==w[0])).slice(0,3)]);
  el.innerHTML=`<div class="bar"><span>Pregunta ${qi+1}/${R.length}</span><span>🔥 x${cb} · ${sc} pts</span></div><div class="tbar"><i id="tb"></i></div><p class="q">${w[2].replace(new RegExp("\\b"+w[0]+"\\b","i"),'<span class="gap">___</span>')}</p><p class="ctx">${w[3]}</p><div class="opts">${o.map(x=>`<button class="opt" data-k="${x[0]}">${x[0]}</button>`).join("")}</div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const t=$("#tb");if(t)t.style.width="0"}));
  t0=Date.now();tm=setTimeout(()=>pick(null),9000);
}
function pick(k){
  clearTimeout(tm);const w=R[qi],ok=k===w[0];
  document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.dataset.k===w[0])b.classList.add("ok");else if(b.dataset.k===k)b.classList.add("bad")});
  document.querySelector(".gap").innerHTML=w[0];
  if(ok){cb++;sc+=100+Math.round(Math.max(0,9000-(Date.now()-t0))/90)+Math.min(cb,5)*10}else{cb=0;if(!w.r){const c=[...w];c.r=1;R.push(c)}}
  const p=k&&all.find(x=>x[0]===k),t=$("#tb");t.style.width=getComputedStyle(t).width;t.style.transition="none";
  const why=ok?`Correcto. <b>${w[0]}</b> significa «${w[1]}», y es justo lo que pide la frase.`:k?`Elegiste <b>${k}</b>, que significa «${p[1]}». Aquí la frase habla de «${w[1]}», así que el verbo correcto es <b>${w[0]}</b>.`:`Se acabó el tiempo. La frase pide «${w[1]}»: <b>${w[0]}</b>.`;
  const f=document.createElement("div");f.className="fb";f.innerHTML=`<p>${ok?"✅":"❌"} ${why}</p><p>📖 <span class="ex">${hl(w[2],w[0])}</span></p><p>🇪🇸 ${w[3]}</p><button class="btn" id="nx" data-go="qnext">${qi+1>=R.length?"Ver resultado":"Siguiente →"}</button>`;
  $("#quiz").append(f);f.scrollIntoView({block:"nearest",behavior:"smooth"});$("#nx").focus();say(w[2]);
}
function go(t){tab=t;document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===t));document.querySelectorAll("main section").forEach(s=>s.classList.toggle("on",s.id===t));$("#sheet").classList.remove("on");clearTimeout(tm);pills();
  if(t==="read")story();if(t==="cards")cards(true);if(t==="quiz")quiz(true);scrollTo(0,0)}
document.addEventListener("click",e=>{
  const t=e.target.closest("button,.fc");
  if(!t){$("#sheet").classList.remove("on");return}
  if(t.dataset.t)go(t.dataset.t);
  else if(t.dataset.i){cur=+t.dataset.i;go(tab)}
  else if(t.dataset.say)say(t.dataset.say);
  else if(t.classList.contains("pv"))sheet(t.dataset.k);
  else if(t.dataset.g)grade(+t.dataset.g);
  else if(t.classList.contains("fc"))flip();
  else if(t.classList.contains("opt"))pick(t.dataset.k);
  else if(t.dataset.go){const g=t.dataset.go;if(g==="cards"||g==="quiz")go(g);else if(g==="again")cards(true);else if(g==="quizagain")quiz(true);else if(g==="next"){cur++;go("cards")}else if(g==="qnext"){qi++;quiz()}}
});
document.addEventListener("keydown",e=>{
  if(tab!=="cards"||!$("#fc"))return;
  if(e.key===" "||e.key==="Enter"){if(e.target.tagName!=="BUTTON"){e.preventDefault();flip()}}
  else if("1234".includes(e.key))grade(+e.key-1);
});
go("read");
</script>
</body>
</html>
